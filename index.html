<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      /* Apply the saved theme before first paint to avoid a flash. Defaults to light. */
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme = stored === "light" || stored === "dark" ? stored : "light";
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          /* localStorage unavailable — keep the default light theme. */
        }
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#f5f5f2" />
    <title>Juan — Creative Developer</title>
    <meta
      name="description"
      content="Creative developer building modern, interactive and high-performance digital experiences."
    />
    <meta name="author" content="Juan" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Juan — Creative Developer" />
    <meta
      property="og:description"
      content="I build digital experiences designed to be remembered."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300..700;1,400&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
