<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" fill="none" role="img" aria-label="Nova placeholder artwork">
  <defs>
    <linearGradient id="nova-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15171c"/>
      <stop offset="100%" stop-color="#090a0c"/>
    </linearGradient>
    <radialGradient id="nova-core" cx="50%" cy="44%" r="55%">
      <stop offset="0%" stop-color="#cbff4d" stop-opacity="0.55"/>
      <stop offset="38%" stop-color="#cbff4d" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#cbff4d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="nova-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" stroke="#ffffff" stroke-opacity="0.035" fill="none"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#nova-base)"/>
  <rect width="1200" height="900" fill="url(#nova-grid)"/>
  <rect width="1200" height="900" fill="url(#nova-core)"/>

  <g stroke="#ffffff" stroke-opacity="0.10">
    <circle cx="600" cy="400" r="96"/>
    <circle cx="600" cy="400" r="164"/>
    <circle cx="600" cy="400" r="236"/>
    <circle cx="600" cy="400" r="316"/>
  </g>

  <g stroke="#ffffff" stroke-opacity="0.05">
    <circle cx="600" cy="400" r="392"/>
  </g>

  <circle cx="600" cy="400" r="34" fill="#cbff4d" fill-opacity="0.16"/>
  <circle cx="600" cy="400" r="13" fill="#cbff4d"/>
  <circle cx="600" cy="400" r="13" fill="#cbff4d" fill-opacity="0.35">
    <animate attributeName="r" values="13;34;13" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.35;0;0.35" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <g stroke="#cbff4d" stroke-opacity="0.75" stroke-linecap="round">
    <path d="M600 400 L600 84"/>
  </g>
  <circle cx="600" cy="84" r="5" fill="#cbff4d"/>

  <g stroke="#ffffff" stroke-opacity="0.07">
    <path d="M0 700h1200"/>
    <path d="M0 760h1200"/>
    <path d="M0 820h1200"/>
  </g>

  <rect x="0" y="0" width="1200" height="900" fill="none"/>
</svg>
