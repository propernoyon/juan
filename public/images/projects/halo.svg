<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 720" width="1680" height="720" fill="none" role="img" aria-label="Halo placeholder artwork">
  <defs>
    <linearGradient id="halo-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0c0e"/>
      <stop offset="100%" stop-color="#131519"/>
    </linearGradient>
    <linearGradient id="halo-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.34"/>
    </linearGradient>
    <pattern id="halo-grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" stroke="#ffffff" stroke-opacity="0.03" fill="none"/>
    </pattern>
  </defs>

  <rect width="1680" height="720" fill="url(#halo-base)"/>
  <rect width="1680" height="720" fill="url(#halo-grid)"/>

  <g>
